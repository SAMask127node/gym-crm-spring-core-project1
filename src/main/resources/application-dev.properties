# Server port
server.port=8080

# DataSource (PostgreSQL + HikariCP)
spring.datasource.url=jdbc:postgresql://localhost:5432/gym_dev
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=gymuser
spring.datasource.password=gympass
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# Hikari tuning
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# Flyway settings
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# if you need to baseline an existing schema
spring.flyway.baseline-on-migrate=true   
# optional:
spring.flyway.placeholder-replacement=true
spring.flyway.placeholders.schema=public

# Swagger UI path
springfox.documentation.swagger.v2.path=/api-docs

# expose only health, metrics and prometheus over HTTP
management.endpoints.web.exposure.include=health,metrics,prometheus

# optional: always show health details (you can scope this to profiles)
management.endpoint.health.show-details=always